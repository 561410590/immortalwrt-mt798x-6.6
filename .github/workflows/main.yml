name: Build ImmortalWrt filogic firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - nradio_c5800-688
          - nradio_c8-688
  push:
    branches:
      - openwrt-24.10-6.6
    paths:
      - .github/workflows/main.yml
      - target/linux/mediatek/image/filogic.mk
      - target/linux/mediatek/dts/**
      - defconfig/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_c5800_688:
    name: Build nradio_c5800-688
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.device == 'all' || github.event.inputs.device == 'nradio_c5800-688' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TARGET: mediatek
      SUBTARGET: filogic
      DEVICE: nradio_c5800-688
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ccache subversion device-tree-compiler python3 python3-pyelftools \
            python3-ply python3-docutils libelf-dev ecj fastjar java-propose-classpath \
            libc6-dev-i386 libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libreadline-dev uglifyjs upx-ucl libyaml-dev msmtp texinfo xmlto qemu-utils \
            genisoimage python3-yaml help2man ninja-build p7zip-full ca-certificates
          ccache --version

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf.default', 'include/version.mk', '.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-dl-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ env.DEVICE }}-ccache-${{ hashFiles('.github/workflows/main.yml', 'target/linux/mediatek/image/filogic.mk', 'target/linux/mediatek/dts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.DEVICE }}-ccache-
            ${{ runner.os }}-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_mediatek=y' \
            'CONFIG_TARGET_mediatek_filogic=y' \
            'CONFIG_TARGET_MULTI_PROFILE=n' \
            'CONFIG_TARGET_PER_DEVICE_ROOTFS=n' \
            "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y" \
            'CONFIG_CCACHE=y' \
            > .config
          make defconfig
          grep -E "CONFIG_TARGET_(mediatek|DEVICE_mediatek_filogic_DEVICE_${DEVICE})|CONFIG_CCACHE" .config

      - name: Download sources
        run: |
          JOBS=$(nproc)
          make download -j"${JOBS}"

      - name: Build firmware
        run: |
          JOBS=$(nproc)
          ccache -z
          make -j"${JOBS}" V=s
          ccache -s

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          firmware_dir="bin/targets/${TARGET}/${SUBTARGET}"
          sysupgrade_file=$(find "$firmware_dir" -maxdepth 1 -type f -name "*${DEVICE}*sysupgrade.bin" | sort | head -n 1)
          if [ -z "$sysupgrade_file" ]; then
            echo "No sysupgrade firmware found for ${DEVICE} in ${firmware_dir}" >&2
            find "$firmware_dir" -maxdepth 1 -type f | sort >&2
            exit 1
          fi

          mkdir -p dist
          cp "$sysupgrade_file" "dist/${DEVICE}-sys.bin"
          cp "$sysupgrade_file" "dist/sys.bin"
          printf '%s\n' "$sysupgrade_file" > dist/firmware-list.txt
          sha256sum "dist/${DEVICE}-sys.bin" "dist/sys.bin" > "dist/${DEVICE}-sys.bin.sha256"

          echo "renamed_file=dist/${DEVICE}-sys.bin" >> "$GITHUB_OUTPUT"
          echo "generic_file=dist/sys.bin" >> "$GITHUB_OUTPUT"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.DEVICE }}
          path: |
            ${{ steps.collect.outputs.renamed_file }}
            ${{ steps.collect.outputs.generic_file }}
            dist/firmware-list.txt
            dist/${{ env.DEVICE }}-sys.bin.sha256
            bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.manifest
            bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/profiles.json
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.DEVICE }}
          path: |
            .config
            bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/config.buildinfo
            logs/**
            tmp/**
          if-no-files-found: warn

  build_c8_688:
    name: Build nradio_c8-688
